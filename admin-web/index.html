<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f3a5c" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talibon Polytechnic College - Alumni Management System</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function(r) {
          r.update();
        });
      });
    }
    if ('caches' in window) {
      caches.keys().then(function (names) {
        names.forEach(function(n) {
          if (n.includes('workbox-precache') || n.includes('tpc-')) {
            // Let the new SW replace these; do not aggressively delete here
            // so offline capability is preserved on first load
          }
        });
      });
    }
  </script>
</head>

<body>
  <div id="root">
    <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#ffffff;font-family:'Inter',system-ui,-apple-system,sans-serif;z-index:99999;padding:1.5rem;box-sizing:border-box;">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;max-width:380px;width:100%;">
        <div style="width:clamp(120px, 18vw, 160px);height:2.5px;background-color:#f1f5f9;border-radius:9999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg, #0f3a5c, #c9a84c);border-radius:9999px;animation:initial-progress 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes initial-progress {
        0% { left: -40%; width: 35%; }
        50% { left: 35%; width: 45%; }
        100% { left: 100%; width: 35%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root div div div div { animation: none !important; }
      }
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
